name: Backup

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      allow_prune:
        description: Autoriser la suppression de plus de 20 % des recettes
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: weekly-recipe-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Mirror the recipe backup
        env:
          CONVEX_BACKUP_URL: ${{ secrets.CONVEX_BACKUP_URL }}
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
          BACKUP_ALLOW_PRUNE: ${{ inputs.allow_prune && '1' || '0' }}
        run: npm run backup

      - name: Commit and push
        shell: bash
        run: |
          recipe_count=$(node -p "JSON.parse(require('node:fs').readFileSync('backup/LAST_RUN.json', 'utf8')).total")
          changed=$(git status --porcelain -- backup | awk '$2 != "backup/LAST_RUN.json" && $2 ~ /^backup\/.*\.json$/ { count++ } END { print count + 0 }')
          if [ "$changed" -gt 0 ]; then
            message="chore(backup): $recipe_count recipes, $changed changed"
          else
            message="chore(backup): heartbeat, no recipe changed"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backup
          git commit -m "$message"
          git push origin HEAD:main
