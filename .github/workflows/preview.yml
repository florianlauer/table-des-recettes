name: Preview

# `pull_request_target` and not `pull_request`. On `pull_request`, GitHub runs the workflow file as
# the pull request writes it, so a pull request could rewrite this very file and move the secrets
# into a job it controls — the split below would be decoration. `pull_request_target` runs the
# definition from the default branch. The price is that the pull request's code is never checked
# out unless a job asks for it explicitly, and exactly one job does.
#
# What each event means is decided by the `gate` job and nowhere else. Read it first.
on:
  pull_request_target:
    types: [labeled, synchronize]

permissions:
  contents: read

# Serialised, not cancelled: `--preview-create` deletes and recreates the backend, so two
# overlapping runs on the same pull request could destroy one while the other imports into it.
# Cancelling is not the answer either — a cancelled job does not stop at once, and the next one would
# start deleting while it is still importing. A burst of commits therefore queues.
concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  # Named after the pull request, never after the branch: two branches can share a name, and a `/`
  # in a branch name is not a valid deployment reference.
  PREVIEW_NAME: pr-${{ github.event.pull_request.number }}

jobs:
  # Reads the event once and says what it asks for. It decides; it does not act — no secrets, no
  # checkout, nothing to protect. Every job below is a consequence of its three outputs, so the policy
  # is stated in one place instead of being re-derived in each condition.
  #
  # `labeled` is the approval, and it approves a state of the world: the backend is deleted and
  # recreated, then seeded with a copy of production. It is the label being *added* that approves, so
  # putting any other label on an already labelled pull request deploys nothing.
  #
  # `synchronize` is not an approval — it only refreshes what one already granted. It therefore runs
  # solely when the label is already on the pull request, and it reuses the backend the label built
  # rather than reseeding it. That is the whole saving: the copy of production is the expensive half,
  # and it is the half that grows with the corpus.
  #
  # So a push can neither put a preview online on an unlabelled pull request nor replace the data
  # under a labelled one. Removing and re-adding the label is how a full reseed is asked for — and
  # what to do when a commit changes the Convex schema in a way the seeded data no longer satisfies,
  # since pushing to the existing backend then fails on purpose.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      reseed: ${{ steps.decide.outputs.reseed }}
      flag: ${{ steps.decide.outputs.flag }}
    steps:
      - name: Decide what this event asks for
        id: decide
        shell: bash
        env:
          # A pull request from a fork never deploys: `build` runs its code with the preview deploy
          # key in scope. Stated once, here, rather than as the tail term of four conditions — a guard
          # nobody can see is a guard nobody rereads.
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          APPROVED: >-
            ${{ github.event.action == 'labeled' && github.event.label.name == 'preview' }}
          REFRESH: >-
            ${{ github.event.action == 'synchronize' &&
            contains(github.event.pull_request.labels.*.name, 'preview') }}
        # Spelled out with `if`, not chained with `&&`: under `set -e` a failing test in a `&&` list
        # is a trap waiting for the next reader, and there is nothing to win here by being terse.
        run: |
          deploy=false
          reseed=false
          # `--preview-create` deletes and recreates the backend; `--preview-name` reuses it.
          flag=--preview-name

          if [ "$SAME_REPO" = true ]; then
            if [ "$APPROVED" = true ]; then
              deploy=true
              reseed=true
              flag=--preview-create
            elif [ "$REFRESH" = true ]; then
              deploy=true
            fi
          fi

          {
            echo "deploy=$deploy"
            echo "reseed=$reseed"
            echo "flag=$flag"
          } >> "$GITHUB_OUTPUT"

  # The only job that runs the pull request's code. It holds the preview deploy key and nothing
  # else — no Vercel token, no production credential.
  build:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Third-party actions are pinned by commit here, unlike ci.yml: this workflow handles secrets
      # and a copy of the production database, so a moved tag must not be able to change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `pull_request_target` checks out the base by default. This is the one line where
          # unreviewed code enters the chain, and `persist-credentials: false` keeps the runner's
          # token out of its `.git`.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # One command deploys the preview backend, pushes the functions to it, and builds the frontend
      # against that backend's URL. `NITRO_PRESET` is an environment variable rather than a pin in
      # vite.config.ts, so the local build stays host-agnostic.
      #
      # The flag comes from `gate`, through `env` rather than interpolated into the command: nothing
      # this workflow writes into a shell is read from the event.
      - name: Deploy the preview backend and build the frontend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PREVIEW }}
          NITRO_PRESET: vercel
          PREVIEW_FLAG: ${{ needs.gate.outputs.flag }}
        run: >-
          npx convex deploy "$PREVIEW_FLAG" "$PREVIEW_NAME"
          --cmd 'npm run build' --cmd-url-env-var-name VITE_CONVEX_URL

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vercel-output
          path: .vercel/output
          # The build output lives under a dotted directory, which the action skips by default.
          include-hidden-files: true
          # It only has to survive until the publish job of this same run.
          retention-days: 1

  # Trusted: checks out already-merged code, never the branch. Holds the production backup key, so
  # it is deliberately the job that does not run anything the pull request wrote.
  #
  # The expensive job — a full export of production with its file storage, then a `--replace-all`
  # import — and therefore the one a push skips.
  data:
    needs: [gate, build]
    if: needs.gate.outputs.reseed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      # `--ignore-scripts`: this job holds the production backup key, and it needs the Convex CLI,
      # not any package's install hook. Installing from the lockfile rather than calling a bare
      # `npx convex` also pins the CLI to the version the repository was verified against.
      - name: Install (no install scripts)
        run: npm ci --ignore-scripts

      # Two steps, one secret each, both mapped onto CONVEX_DEPLOY_KEY — the only name the CLI
      # reads. The backup key can create and download a backup and nothing else; it must never be
      # the key that writes.
      - name: Export production
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_BACKUP_KEY_PROD }}
        # `--include-file-storage` is required: the export leaves stored files out by default, and
        # without them every `_storage` reference would land dangling in the preview.
        run: npx convex export --prod --include-file-storage --path snapshot.zip

      - name: Import into the preview backend
        shell: bash
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PREVIEW }}
        run: |
          if unzip -Z1 snapshot.zip | grep -q 'documents\.jsonl$'; then
            npx convex import --deployment "preview/$PREVIEW_NAME" --replace-all --yes snapshot.zip
          else
            # Production has no table yet — the case until a draft can be published. Skipping is
            # only safe because the build job just recreated the backend: it is already empty, so
            # there is nothing stale left behind.
            echo "Snapshot carries no table: production is still empty, import skipped."
          fi

      # The import brings in production rows as they are, so a snapshot taken before a backfill has
      # run in production lands unmigrated here. Production runs the same series at the end of its
      # own deploy (`vercel.json`); this is its preview counterpart, and the only place in the
      # workflow where data arrives. A push, which skips this job, keeps the backend it already had.
      - name: Run the migrations
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PREVIEW }}
        run: >-
          npx convex run --deployment "preview/$PREVIEW_NAME"
          convex/migrations.ts:runAll

      # Separates an import that technically succeeded from a backend that is actually usable.
      # `countsByType` is a public query of the storefront, so it needs no admin token.
      - name: Smoke check
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PREVIEW }}
        run: npx convex run --deployment "preview/$PREVIEW_NAME" recipes:countsByType

  # Trusted: no checkout at all, and the sole holder of the Vercel token — `VERCEL_PROJECT_ID` does
  # not restrict what that token can do, it is valid for the whole team. Waiting on `data` as well
  # as `build` keeps a failed import from leaving a public preview online over an unknown state.
  #
  # Nothing about the event here, only about results. `data` is skipped on every push, and a skipped
  # dependency skips its dependents by default — `!cancelled()` is what makes this condition run at
  # all in that case, so each result then has to be stated. `skipped` is fine for `data`, `failure`
  # never is. A `deploy` term would be redundant: if the gate refused, `build` never succeeded.
  publish:
    needs: [build, data]
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (needs.data.result == 'success' || needs.data.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vercel-output
          path: .vercel/output

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # Exact version, not a range: `npx vercel` resolves whatever is current, which is not what
      # was verified. Uploading a prebuilt output means no remote build, so the `ignoreCommand` in
      # vercel.json — which cancels every non-production git build — never comes into play here.
      - name: Deploy the prebuilt output
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url=$(npx --yes vercel@54.14.0 deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"

  # Trusted: no checkout, and the only job allowed to write to the pull request. That permission
  # therefore never passes through the job running unreviewed code.
  #
  # No condition of its own: it runs exactly when `publish` succeeded, which only happens when the
  # gate allowed the deployment in the first place.
  comment:
    needs: [gate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ needs.publish.outputs.url }}
          DEPLOYED_SHA: ${{ github.event.pull_request.head.sha }}
          RESEEDED: ${{ needs.gate.outputs.reseed }}
        with:
          script: |
            // The SHA is part of the message on purpose: runs are queued rather than cancelled, so
            // a preview can briefly correspond to an earlier commit, and only the SHA shows it.
            //
            // What the data is worth saying too — but only what is known. After a push, this run did
            // not reseed anything; what the backend actually holds it cannot claim, since a preview
            // that expired between two commits comes back empty.
            const reseeded = process.env.RESEEDED === 'true'
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `Preview deployed for \`${process.env.DEPLOYED_SHA}\`:`,
                ``,
                process.env.PREVIEW_URL,
                ``,
                `The URL asks for a Vercel session — that is Deployment Protection, not a failure.`,
                reseeded
                  ? `The backend was just recreated with a copy of the production database, and expires after 5 days.`
                  : `Only the code was redeployed, the backend was not reseeded. Remove and re-add the \`preview\` label to start again from a fresh copy of production.`,
              ].join('\n'),
            })
