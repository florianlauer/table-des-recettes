name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: the checks only read the tree. Nothing here comments, labels or publishes.
permissions:
  contents: read

# A new push to the same branch makes the previous run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from `packageManager` in package.json, so CI installs with the same
      # pnpm as everyone else. It must come before setup-node, whose `cache: pnpm` calls it.
      - uses: pnpm/action-setup@v6

      # Node 22 to match devenv.nix (`nodejs_22`), which is the project's source of truth for the
      # local toolchain. Bumping one without the other is how CI stops reproducing local results.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      # `--frozen-lockfile`: the lockfile is committed, and a CI that resolves fresh versions is not
      # testing the tree under review. pnpm already defaults to it on CI; spelled out so nobody has to
      # know that.
      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      # Every check below runs even when an earlier one fails, so one run reports all seven results
      # instead of stopping at the first. They are skipped only when the install itself failed —
      # their output would be noise about missing modules, not about the code.
      - name: Format (vp fmt)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run check

      - name: Lint (vp lint)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run lint

      - name: Typecheck (application)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run typecheck

      - name: Tests (application)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

      # The only check that assembles the browser bundle, and therefore the only one that can catch
      # a server module reaching the client: the other six were green while the bundle carried the
      # extraction module, OpenRouter prompt included. It needs no secret — `VITE_CONVEX_URL` is
      # read when a request is served, not when the bundle is built.
      - name: Build (application)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run build

      # The two spike benches keep their own tsconfig and vitest config, so they need their own
      # commands. `verify*` are the only bench scripts that touch no network: the `ingest*`, `rank`,
      # `walk`, `run*`, `correct` and `accept` scripts call OpenRouter and are billed. None of them
      # belongs in CI, and consequently no API key has to exist as a repository secret.
      - name: Tests (bench T1 — extraction)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run verify

      - name: Tests (bench T13 — beautification)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run verify13
